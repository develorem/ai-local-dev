# OrchestrAi compose
#
# Brings up Hub + Ollama + one Agent.
# Run:   docker compose up -d
# UI:    http://localhost:6724
# API:   http://localhost:6724/api/health
#
# For multi-agent or multi-host setups: duplicate the `agent` service block
# with a different container_name and AGENT_NAME, or deploy Dockerfile.agent
# on another machine and set ORCHESTRAI_HUB_URL to the Hub's reachable URL.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: orchestrai-ollama
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              count: all
    environment:
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - orchestrai-net
    restart: unless-stopped

  hub:
    build:
      context: .
      dockerfile: Dockerfile.hub
    container_name: orchestrai-hub
    depends_on:
      - ollama
    environment:
      OLLAMA_URL: http://ollama:11434
      DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      - "6724:6724"
    networks:
      - orchestrai-net
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: orchestrai-agent
    depends_on:
      - hub
      - ollama
    environment:
      ORCHESTRAI_HUB_URL: http://hub:6724
      OLLAMA_URL: http://ollama:11434
      AGENT_NAME: "agent@${COMPUTERNAME:-local}"
      MODEL_PRIMARY: qwen2.5-coder:14b
      INFERENCE_NUM_CTX: "16384"
    networks:
      - orchestrai-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G

volumes:
  ollama-models:

networks:
  orchestrai-net:
    driver: bridge
